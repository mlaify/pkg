# What the index lists. build_index.py reads every non-draft, non-pre-release GitHub release of
# each repository below, keeps the assets whose names match one of its patterns, and links them
# from https://pkg.mlaify.io/pypi/simple/<project>/ with the SHA-256 GitHub recorded for each.
# Release a project as usual and it appears at the next run (every six hours, or run the
# workflow by hand).
#
# Ported from ci-publish packages/sources.toml (2026-11-09), the previous publisher of this index.

[[repo]]
repo = "mlaify/AttackMap"
assets = ['^attackmap-[0-9][^/]*-py3-none-any\.whl$', '^attackmap-[0-9][^/]*\.tar\.gz$']

# The AttackMap analyzers. Wheel and sdist names use underscores (attackmap_analyzer_go-0.2.0-...).

